name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Опубликовать версионированный Release (создаст тег sandbox-build-N)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Show build environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed

      - name: Build debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace --console=plain assembleDebug \
            > "$RUNNER_TEMP/gradle-build.log" 2>&1
          build_status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$build_status" -ne 0 ]; then
            diagnostic=$(grep -E 'FAILURE:|What went wrong:|Where:|Could not resolve|Could not find|Unresolved reference|error:|Caused by:|^e:' "$RUNNER_TEMP/gradle-build.log" \
              | head -n 25 | paste -sd ' ' - | sed 's/%/%25/g' | cut -c1-900)
            echo "::error title=Gradle build failed::${diagnostic:-see the build log above}"
          fi
          exit "$build_status"

      - name: Prepare APK for publishing
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" dist/Sandbox-debug.apk
          ls -lh dist/
          sha256sum dist/Sandbox-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-apk
          path: dist/Sandbox-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download (rolling release)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: sandbox-apk-latest
        run: |
          set -euo pipefail
          if gh release view "$APK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$APK_TAG" dist/Sandbox-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$APK_TAG" dist/Sandbox-debug.apk --repo "$GITHUB_REPOSITORY" \
              --title "Sandbox — Android APK" \
              --notes "Latest installable debug APK, built automatically by GitHub Actions." \
              --target "$GITHUB_SHA"
          fi
          echo "::notice::Direct APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${APK_TAG}/Sandbox-debug.apk"

      - name: Publish versioned APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="sandbox-build-${GITHUB_RUN_NUMBER}"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" dist/Sandbox-debug.apk \
            --title "Sandbox APK ${TAG}" \
            --generate-notes
