name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "public/**"
      - "server.js"
      - "package.json"
      - ".github/workflows/android-apk.yml"
      - "README.md"
  workflow_dispatch:
    inputs:
      web_app_url:
        description: "Optional public HTTPS URL of the deployed messenger server"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        env:
          WEB_APP_URL: ${{ github.event.inputs.web_app_url || vars.WEB_APP_URL || '' }}
        run: |
          set +e
          gradle -p android assembleDebug --no-daemon --stacktrace --console=plain -PwebAppUrl="$WEB_APP_URL" > "$RUNNER_TEMP/gradle-build.log" 2>&1
          build_status=$?
          cat "$RUNNER_TEMP/gradle-build.log"
          if [ "$build_status" -ne 0 ]; then
            diagnostic="$(grep -E 'FAILURE:|What went wrong:|Where:|A problem occurred|Could not resolve|Could not find|Unresolved reference|Compilation error|error:|Caused by:|^[[:space:]]*> |^[[:space:]]*e:' "$RUNNER_TEMP/gradle-build.log" | head -n 45 | paste -sd ' ' - | sed 's/%/%25/g')"
            if [ -z "$diagnostic" ]; then
              diagnostic="$(tail -n 20 "$RUNNER_TEMP/gradle-build.log" | paste -sd ' ' - | sed 's/%/%25/g')"
            fi
            echo "::error title=Gradle build failed::$diagnostic"
          fi
          exit "$build_status"

      - name: Prepare download
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/nit-messenger.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nit-messenger-apk
          path: dist/nit-messenger.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        if: github.ref == 'refs/heads/arena/3e8ee0f6-repo'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: android-apk-latest
        run: |
          if gh release view "$APK_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$APK_TAG" dist/nit-messenger.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$APK_TAG" dist/nit-messenger.apk --repo "$GITHUB_REPOSITORY" --title "Нить — Android APK" --notes "Latest installable debug APK. The app needs a public HTTPS URL of the deployed messenger server on first launch." --target "$GITHUB_SHA"
          fi
